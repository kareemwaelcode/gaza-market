<header class="ud-topnav">
  <div class="ud-topnav-brand">
    <div class="ud-topnav-logo-box"><img src="../../assets/img/logo.gazamarket.png" alt="سوق غزة" class="ud-topnav-logo-img" width="38" height="38"> </div>
    <div class="ud-topnav-titles">
      <span class="ud-topnav-title">لوحة التحكم</span>
      <span class="ud-topnav-subtitle">سوق غزة - للأعمال</span>
    </div>
  </div>

  <div class="ud-topnav-actions">
    <button type="button" class="ud-topnav-account" data-action="go-to-profile" aria-label="بيانات المساحة">
      <span class="ud-topnav-username" id="udTopnavUsername"></span>
      <div class="avatar ud-topnav-avatar"></div>
    </button>
    <button type="button" class="ud-topnav-icon-btn" data-action="toggle-theme" aria-label="تبديل الوضع الليلي">
      <i data-lucide="moon" class="icon"></i>
    </button>
    <div class="ud-notif-wrap">
      <button type="button" class="ud-topnav-icon-btn" data-action="toggle-notifications" aria-label="الإشعارات">
        <i data-lucide="bell" class="icon"></i>
        <span class="notif-dot" id="notifDot"></span>
      </button>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-header">
          <span>الإشعارات</span>
          <button type="button" class="notif-panel-clear" data-action="clear-notifications">مسح الكل</button>
        </div>
        <div class="notif-panel-body" id="notifPanelBody"></div>
      </div>
    </div>
  </div>
</header>
