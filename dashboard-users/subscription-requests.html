<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3o54scuLFSA2Ohs6oKpM60iCOJjwRLVPKqDg1Ot1xw8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

<body data-page="subscription-requests">
<script>(function(){try{if(localStorage.getItem('gaza-market-dashboard-theme')==='dark'){document.body.classList.add('dark-mode');}}catch(e){}})();</script>

  <div id="topnav-slot"></div>

  <aside class="side-panel">
    <div id="topbar-slot"></div>
    <div id="sidebar-slot"></div>
  </aside>

  <div class="app-shell">
    <main class="app-main">

      <button class="mobile-menu-btn" data-action="open-sidebar" aria-label="فتح القائمة">
        <i data-lucide="menu" class="icon"></i>
      </button>

      <div class="app-content">

        <div class="page-head">
          <div>
            <div class="page-title">طلبات الاشتراك</div>
            <div class="page-subtitle">طلبات اشتراك وصلتك أونلاين — وافق لإضافة المشترك أو ارفض</div>
          </div>
        </div>

        <div id="req-data-wrap" style="display:none;">

          <div class="card card-pad" id="req-table-card">
            <div class="table-wrap" id="req-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>المشترك</th>
                    <th>الواتساب</th>
                    <th>النوع</th>
                    <th>البدء المطلوب</th>
                    <th>وقت الطلب</th>
                    <th>إجراءات</th>
                  </tr>
                </thead>
                <tbody id="req-table-body"></tbody>
              </table>
            </div>
          </div>

          <div class="sub-cards-wrap" id="req-cards-wrap"></div>

        </div>

        <div class="card card-pad empty-state" id="req-empty-state">
          <i data-lucide="thumbs-up" class="icon"></i>
          <div class="title">لا يوجد طلبات اشتراك حالياً</div>
          <div class="sub">راح تظهر هون أي طلبات اشتراك جديدة توصلك من صفحة مساحتك</div>
        </div>

      </div>
    </main>
  </div>

  <div id="prices-edit-slot"></div>
  <div id="services-edit-slot"></div>

  <div id="mobile-nav-slot"></div>

  <script src="../js/vendor/lucide.min.js" defer></script>
  <script src="../js/add-store-api.js" defer></script>
  <script src="../js/store-type-config.js" defer></script>
  <script src="../js/dashboard/core.js" defer></script>
  <script src="../js/dashboard/shell.js" defer></script>
  <script src="../js/dashboard/page-runner.js" defer></script>
  <script src="../js/dashboard/common.js" defer></script>
  <script src="../js/dashboard/pages/subscribers.js" defer></script>
