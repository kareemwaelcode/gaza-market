<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3o54scuLFSA2Ohs6oKpM60iCOJjwRLVPKqDg1Ot1xw8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>الطاولات — سوق غزة</title>
<script src="../js/gm-core.js" defer></script>
<script src="auth/auth-api.js" defer></script>
<script src="auth/auth-guard.js" defer></script>
<link rel="stylesheet" href="../css/user-dashboard.css">
</head>
<body data-page="tables">
<script>(function(){try{if(localStorage.getItem('gaza-market-dashboard-theme')==='dark'){document.body.classList.add('dark-mode');}}catch(e){}})();</script>

  <div id="topnav-slot"></div>

  <aside class="side-panel">
    <div id="topbar-slot"></div>
    <div id="sidebar-slot"></div>
  </aside>

  <div class="app-shell">
    <main class="app-main">

      <button class="mobile-menu-btn" data-action="open-sidebar" aria-label="فتح القائمة">
        <i data-lucide="menu" class="icon"></i>
      </button>

      <div class="app-content">

        <div class="page-head">
          <div>
            <div class="breadcrumb">سوق غزة <span class="sep">/</span> <span class="current">الطاولات</span></div>
            <div class="page-title">الطاولات</div>
            <div class="page-subtitle">حدد عدد طاولات نشاطك وحالتها ليختار الزبون منها عند الحجز</div>
            <div class="page-subtitle" id="tbl-usage-counter" style="display:none;"></div>
            <div class="page-subtitle" id="tbl-hidden-note" style="display:none;"></div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary btn-pill" data-action="open-table-add">
              <i data-lucide="plus" class="icon"></i> طاولة جديدة
            </button>
          </div>
        </div>

        <div class="stat-grid stat-grid--3">
          <div class="stat-card stat-card--plain">
            <div class="label">الإجمالي</div>
            <div class="value" id="tbl-stat-total">0</div>
          </div>
          <div class="stat-card stat-card--plain">
            <div class="label">متاحة</div>
            <div class="value" id="tbl-stat-available" style="color:var(--db-accent-text);">0</div>
          </div>
          <div class="stat-card stat-card--plain">
            <div class="label">مستخدمة</div>
            <div class="value" id="tbl-stat-occupied" style="color:var(--db-red-text);">0</div>
          </div>
        </div>

        <div class="card card-pad empty-state" id="tbl-state" role="status" aria-live="polite">
          <div id="tbl-state-icon"></div>
          <div class="title" id="tbl-state-title">جاري تحميل الطاولات...</div>
          <div class="sub" id="tbl-state-sub"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="tbl-state-retry" data-action="retry-tables" style="display:none;margin-top:12px;">
            <i data-lucide="refresh-cw" class="icon" style="width:16px;height:16px;margin:0;"></i> جرّب مرة ثانية
          </button>
        </div>

        <div id="tbl-data-wrap" style="display:none;">

          <div class="card card-pad" id="tbl-table-card">
            <div class="table-wrap" id="tbl-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>الطاولة</th>
                    <th>عدد الكراسي</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                  </tr>
                </thead>
                <tbody id="tbl-table-body"></tbody>
              </table>
            </div>
          </div>

          <div class="sub-cards-wrap" id="tbl-cards-wrap"></div>

        </div>

        <div class="card card-pad empty-state" id="tbl-empty-state" style="display:none;">
          <i data-lucide="armchair" class="icon"></i>
          <div class="title">لا يوجد طاولات مُضافة بعد</div>
          <div class="sub">
            <a href="#" data-action="open-table-add">أضف طاولات نشاطك ليقدر الزوار يحجزوا منها</a>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="table-edit-slot"></div>
  <div id="services-edit-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="../js/vendor/lucide.min.js" defer></script>
  <script src="../js/add-store-api.js" defer></script>
  <script src="../js/store-type-config.js" defer></script>
  <script src="../js/dashboard/core.js" defer></script>
  <script src="../js/dashboard/shell.js" defer></script>
  <script src="../js/dashboard/page-runner.js" defer></script>
  <script src="../js/dashboard/common.js" defer></script>
  <script src="../js/dashboard/booking-api.js" defer></script>
  <script src="../js/dashboard/pages/tables.js" defer></script>
</body>
</html>
