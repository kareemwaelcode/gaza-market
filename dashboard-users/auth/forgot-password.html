<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3o54scuLFSA2Ohs6oKpM60iCOJjwRLVPKqDg1Ot1xw8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>استعادة كلمة المرور — سوق غزة</title>
<link rel="stylesheet" href="../../css/user-dashboard.css">
<link rel="stylesheet" href="auth.css">
</head>
<body data-page="forgot-password">

  <button type="button" class="icon-btn auth-theme-toggle" data-action="toggle-theme" aria-label="التبديل إلى الوضع الليلي">
    <i data-lucide="moon" class="icon"></i>
  </button>

  <main class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <div class="auth-logo">غ</div>
        <h1 class="auth-title">استعادة كلمة المرور</h1>
        <p class="auth-subtitle">سوق غزة · لوحة التحكم</p>
      </div>

      <div class="card auth-card">

        <div class="auth-alert" id="forgot-alert" role="alert" hidden>
          <i data-lucide="alert-circle" class="icon"></i>
          <span id="forgot-alert-text"></span>
        </div>

        <section class="auth-step" id="forgot-phone-step">
          <p class="auth-step-text">أدخل رقم الواتساب المسجل، وسنرسل لك كود تفعيل لإنشاء كلمة مرور جديدة.</p>

          <form id="forgot-phone-form" novalidate>
            <div class="field" id="forgot-whatsapp-field">
              <label for="forgot-whatsapp">رقم الواتساب</label>
              <div class="auth-input-wrap">
                <i data-lucide="message-circle" class="icon auth-input-icon"></i>
                <input
                  type="tel"
                  id="forgot-whatsapp"
                  name="whatsapp"
                  class="auth-input-ltr"
                  inputmode="numeric"
                  autocomplete="username"
                  dir="ltr"
                  placeholder="972597******"
                >
              </div>
              <div class="hint">اكتب الرقم بدءاً برمز الدولة (972 أو 970) بدون علامة +</div>
              <div class="field-error" id="forgot-whatsapp-error"></div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="forgot-phone-submit">
              <i data-lucide="send" class="icon"></i> إرسال كود التفعيل
            </button>
          </form>
        </section>

        <section class="auth-step" id="forgot-code-step" hidden>
          <p class="auth-step-text">إذا كان الرقم مسجلاً، أرسلنا كوداً من 6 أرقام إلى واتساب <span class="auth-phone-mask mono" id="forgot-code-target"></span>. أدخله لتأكيد هويتك.</p>

          <form id="forgot-code-form" novalidate>
            <div class="field" id="forgot-code-field">
              <label for="forgot-code-1">كود التفعيل</label>
              <div class="auth-code-inputs" id="forgot-code-inputs" dir="ltr">
                <input type="text" id="forgot-code-1" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1 من 6">
                <input type="text" id="forgot-code-2" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 2 من 6">
                <input type="text" id="forgot-code-3" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 3 من 6">
                <input type="text" id="forgot-code-4" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 4 من 6">
                <input type="text" id="forgot-code-5" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 5 من 6">
                <input type="text" id="forgot-code-6" class="auth-code-input" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 6 من 6">
              </div>
              <div class="field-error" id="forgot-code-error"></div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="forgot-code-submit">
              <i data-lucide="shield-check" class="icon"></i> تأكيد الكود
            </button>
          </form>

          <div class="auth-step-links">
            <button type="button" class="auth-link auth-link-btn" id="forgot-change-number">تغيير الرقم</button>
            <button type="button" class="auth-link auth-link-btn" id="forgot-resend-btn">إعادة إرسال الكود</button>
          </div>
        </section>

      </div>

      <a href="login.html" class="auth-link auth-back">
        <i data-lucide="arrow-right" class="icon"></i> العودة لتسجيل الدخول
      </a>

    </div>
  </main>

  <script src="../../js/vendor/lucide.min.js" defer></script>
  <script src="auth-api.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
