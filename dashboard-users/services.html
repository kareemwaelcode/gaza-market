<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3o54scuLFSA2Ohs6oKpM60iCOJjwRLVPKqDg1Ot1xw8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>الخدمات — سوق غزة</title>
<script src="../js/gm-core.js" defer></script>
<script src="auth/auth-api.js" defer></script>
<script src="auth/auth-guard.js" defer></script>
<link rel="stylesheet" href="../css/user-dashboard.css">
</head>
<body data-page="services">
<script>(function(){try{if(localStorage.getItem('gaza-market-dashboard-theme')==='dark'){document.body.classList.add('dark-mode');}}catch(e){}})();</script>

  <div id="topnav-slot"></div>

  <aside class="side-panel">
    <div id="topbar-slot"></div>
    <div id="sidebar-slot"></div>
  </aside>

  <div class="app-shell">
    <main class="app-main">

      <button class="mobile-menu-btn" data-action="open-sidebar" aria-label="فتح القائمة">
        <i data-lucide="menu" class="icon"></i>
      </button>

      <div class="app-content">

        <div class="page-head">
          <div>
            <div class="breadcrumb">سوق غزة <span class="sep">/</span> <span class="current" data-store-type-copy="servicesPageTitle">الخدمات</span></div>
            <div class="page-title" data-store-type-copy="servicesPageTitle">الخدمات</div>
            <div class="page-subtitle" id="service-usage-counter" style="display:none;"></div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-ghost" data-action="open-service-category-panel">
              <i data-lucide="folder-plus" class="icon"></i> التصنيفات
              <span class="btn-count" id="service-cat-btn-count">0</span>
            </button>
            <button type="button" class="btn btn-primary" data-action="open-service-item-add">
              <i data-lucide="plus" class="icon"></i> إضافة خدمة
            </button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="card stat-card">
            <div class="icon-wrap brand"><i data-lucide="wrench" class="icon"></i></div>
            <div><div class="value" id="service-stat-total">0</div><div class="label">إجمالي الخدمات</div></div>
          </div>
          <div class="card stat-card">
            <div class="icon-wrap amber"><i data-lucide="folder" class="icon"></i></div>
            <div><div class="value" id="service-stat-categories">0</div><div class="label">التصنيفات</div></div>
          </div>
        </div>

        <div id="service-data-wrap" style="display:none;">
          <div class="card card-pad">
            <div class="card-header menu-card-header">
              <div>
                <h3>خدماتك المعروضة</h3>
                <div class="sub">الخدمات التي يطّلع عليها الزوار عند تصفح متجرك</div>
              </div>
              <div class="menu-search">
                <input type="search" id="service-search-input" placeholder="ابحث عن خدمة...">
                <i data-lucide="search" class="icon"></i>
              </div>
            </div>

            <div class="table-wrap">
              <table class="data-table menu-table">
                <thead>
                  <tr>
                    <th>الخدمة</th>
                    <th>التصنيف</th>
                    <th>السعر</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="service-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card card-pad empty-state" id="service-empty-state">
          <i data-lucide="wrench" class="icon"></i>
          <div class="title">لم تُضِف أي خدمة بعد</div>
          <div class="sub" data-store-type-copy="servicesEmptyText">أضف خدمة مثل التركيب أو الضمان ليطّلع عليها الزوار قبل زيارتك</div>
        </div>

        <div class="section-title" id="service-suggestions-title" style="display:none;">أفكار خدمات شائعة لنشاطك</div>
        <div class="quick-grid" id="service-suggestions-grid"></div>

      </div>
    </main>
  </div>

  <div id="service-category-slot"></div>
  <div id="service-item-edit-slot"></div>
  <div id="mobile-nav-slot"></div>

  <script src="../js/vendor/lucide.min.js" defer></script>
  <script src="../js/add-store-api.js" defer></script>
  <script src="../js/store-type-config.js" defer></script>
  <script src="../js/dashboard/core.js" defer></script>
  <script src="../js/dashboard/shell.js" defer></script>
  <script src="../js/dashboard/page-runner.js" defer></script>
  <script src="../js/dashboard/common.js" defer></script>
  <script src="../js/dashboard/pages/extra-fields.js" defer></script>
  <script src="../js/dashboard/pages/services.js" defer></script>
</body>
</html>
